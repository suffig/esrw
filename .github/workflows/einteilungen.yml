name: Einteilungen aktualisieren

on:
  schedule:
    # Alle 30 Minuten zwischen ca. 07:00 und 00:30 deutscher Zeit.
    # GitHub rechnet in UTC.
    - cron: "*/30 5-22 * * *"
  workflow_dispatch:      # Knopf zum manuellen Ausloesen
    inputs:
      fehler_testen:
        description: "Absichtlich scheitern, um die Fehler-Benachrichtigung zu pruefen"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "esrw_ical.py"
      - "venues.json"
      - "config.json"
      - "tests/**"

permissions:
  contents: write
  issues: write          # fuer die Meldung bei neuer Einteilung

concurrency:
  group: einteilungen
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Nur zum Ausprobieren der Alarmkette: ueber "Run workflow" mit gesetztem
      # Haken laeuft dieser Schritt auf einen Fehler, alle folgenden Schritte
      # werden uebersprungen und die Benachrichtigung geht raus. Es wird dabei
      # nichts veroeffentlicht, die bestehenden Feeds bleiben unberuehrt.
      - name: Testfehler ausloesen
        if: github.event_name == 'workflow_dispatch' && inputs.fehler_testen
        run: |
          echo "Absichtlich ausgeloester Testfehler - kein echtes Problem."
          exit 1

      # Laeuft ohne Netz gegen die eingefrorene Beispielseite. Schlaegt an,
      # wenn eine Aenderung am Skript das Auslesen kaputt gemacht hat.
      - name: Regressionstest
        run: python tests/test_esrw.py

      - name: Feed bauen
        env:
          # Optional: Repository -> Settings -> Secrets -> Actions -> NTFY_TOPIC
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Legt bei Aenderungen eine Meldung fuer den naechsten Schritt ab
          MELDUNG_DATEI: meldung.txt
        run: python esrw_ical.py

      # Zweiter Meldeweg, der ohne zusaetzliche App auskommt: GitHub schickt
      # fuer ein neues Issue von sich aus eine E-Mail an den Repository-
      # Eigentuemer, und die GitHub-App auf dem Handy meldet sich per Push.
      - name: Bei neuer Einteilung ein Issue anlegen
        if: hashFiles('meldung.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITEL=$(head -n 1 meldung.txt)
          tail -n +2 meldung.txt > rumpf.txt
          echo "" >> rumpf.txt
          echo "Quelle: https://www.esrw.de/einteilungen.html" >> rumpf.txt
          gh issue create --title "$TITEL" --body-file rumpf.txt --label einteilung \
            || gh issue create --title "$TITEL" --body-file rumpf.txt

      - name: Aenderungen veroeffentlichen
        run: |
          git config user.name  "esrw-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs state.json historie.json
          if git diff --staged --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Einteilungen aktualisiert ($(TZ=Europe/Berlin date +'%d.%m.%Y %H:%M'))"
            git push
          fi

      # Ohne diesen Schritt wuerde ein Ausfall unbemerkt bleiben: die Feeds
      # frieren dann einfach ein, ohne dass jemand etwas merkt.
      - name: Bei Fehler benachrichtigen
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TESTLAUF: ${{ inputs.fehler_testen }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "Kein NTFY_TOPIC hinterlegt - keine Benachrichtigung moeglich."
            exit 0
          fi
          if [ "$TESTLAUF" = "true" ]; then
            TITEL="Einteilungen: Test der Fehlermeldung"
            TEXT="Das war ein absichtlicher Testfehler. Wenn du das liest, funktioniert die Alarmkette. Lauf: $LAUF"
          else
            TITEL="Einteilungen: Automatik steht"
            TEXT="Der Lauf ist fehlgeschlagen, die Kalender werden nicht mehr aktualisiert. Details: $LAUF"
          fi
          curl -sS --fail-with-body \
            -H "Title: $TITEL" \
            -H "Priority: high" \
            -H "Tags: warning" \
            -d "$TEXT" \
            "https://ntfy.sh/$NTFY_TOPIC"
